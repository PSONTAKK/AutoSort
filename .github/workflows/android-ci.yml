name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  JAVA_VERSION: '17'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Inject a dummy Client ID so BuildConfig compiles in CI
      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "WEB_CLIENT_ID=dummy-ci-value" >> local.properties

      # ── Secret Scanning ─────────────────────────────────────────
      - name: Scan for leaked secrets
        run: |
          echo "Scanning for hardcoded secrets..."
          if grep -rn "apps.googleusercontent.com" --include="*.kt" --include="*.xml" .; then
            echo "::error::Hardcoded Google Client ID found in source files!"
            exit 1
          fi
          echo "No secrets found in source. ✅"

      # ── Build ───────────────────────────────────────────────────
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      # ── Unit Tests ──────────────────────────────────────────────
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # ── Lint ────────────────────────────────────────────────────
      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon

      # ── Upload reports ──────────────────────────────────────────
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html

  # ── Security checks (separate job) ─────────────────────────────
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check .gitignore covers secrets
        run: |
          echo "Verifying .gitignore blocks sensitive files..."
          for pattern in "*.keystore" "keystore.properties" "local.properties" ".idea/"; do
            if grep -q "$pattern" .gitignore; then
              echo "  ✅ $pattern is gitignored"
            else
              echo "  ❌ $pattern is NOT in .gitignore!"
              exit 1
            fi
          done

      - name: Verify allowBackup is false
        run: |
          if grep -q 'android:allowBackup="true"' app/src/main/AndroidManifest.xml; then
            echo "::error::allowBackup must be false!"
            exit 1
          fi
          echo "allowBackup=false verified. ✅"

      - name: Verify networkSecurityConfig is set
        run: |
          if ! grep -q 'android:networkSecurityConfig' app/src/main/AndroidManifest.xml; then
            echo "::error::networkSecurityConfig not found in manifest!"
            exit 1
          fi
          echo "networkSecurityConfig present. ✅"

      - name: Verify no hardcoded Client ID
        run: |
          if grep -rn "apps.googleusercontent.com" --include="*.kt" .; then
            echo "::error::Hardcoded Google Client ID detected!"
            exit 1
          fi
          echo "No hardcoded Client ID. ✅"
